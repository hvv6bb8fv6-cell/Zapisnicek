<title>Zápisník</title>
<style>
:root{--bg:#0e0f23;--txt:#f1f1fa;--mut:#a3a5c4;--glass:rgba(255,255,255,.08);--bd:rgba(255,255,255,.15);--ac:#8b7bff;--ac2:#ff7ab8;--ok:#5be3b0;--warn:#ff8a7a;--nav:rgba(20,21,48,.72)}
[data-theme=light]{--bg:#f2f0ff;--txt:#23244a;--mut:#6b6d95;--glass:rgba(255,255,255,.62);--bd:rgba(255,255,255,.95);--nav:rgba(255,255,255,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;background:var(--bg);height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{margin:0;position:absolute;top:var(--T,0px);left:0;right:0;height:var(--H,100%);overflow:hidden}
input,textarea,select{font-size:16px}
label.ib{overflow:hidden;flex:none}
.ib input{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.pill{position:relative;z-index:2}
body{background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;transition:background-color .12s ease}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;animation:drift 18s ease-in-out infinite alternate}
.b1{width:300px;height:300px;background:#6a5cff;top:-80px;left:-80px}
.b2{width:280px;height:280px;background:#ff5fa8;bottom:80px;right:-100px;animation-delay:-6s}
.b3{width:240px;height:240px;background:#2fd3c0;top:40%;left:-120px;animation-delay:-11s;opacity:.35}
[data-theme=light] .blob{opacity:.4}
@keyframes drift{to{transform:translate(60px,50px) scale(1.15)}}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:calc(max(env(safe-area-inset-top,0px),var(--sat,0px)) + 14px) 22px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:28px;letter-spacing:-.5px}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
.ring{position:relative;width:54px;height:54px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px}
main{flex:1;overflow-y:auto;padding:8px 16px 150px;-webkit-overflow-scrolling:touch}
.glass{background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
ul{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:8px;padding:10px 8px;margin-bottom:10px;animation:in .35s cubic-bezier(.2,.9,.3,1.2) both;position:relative;transition:opacity .4s,transform .4s}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.96)}}
.task.drag{z-index:5;box-shadow:0 16px 40px rgba(0,0,0,.4);transition:none;scale:1.03}
.task.out{opacity:0;transform:translateX(40px) scale(.9)}
.grip{touch-action:none;color:var(--mut);padding:6px 2px;cursor:grab;display:grid}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);background:none;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;transition:.25s}
.chk svg{opacity:0;transform:scale(.3);transition:.3s cubic-bezier(.2,1.6,.4,1)}
.done .chk,.chk.on{background:linear-gradient(135deg,var(--ok),#2fd3c0);border-color:transparent;box-shadow:0 0 0 6px rgba(91,227,176,.18)}
.done .chk svg,.chk.on svg{opacity:1;transform:none}
.tx{flex:1;min-width:0;word-break:break-word;padding:2px 2px}
.tx small{display:block;font-size:12px;color:var(--ac);margin-top:1px}
.tx small.late{color:var(--warn)}
.done .tx{text-decoration:line-through;color:var(--mut)}
.ib{background:none;border:0;color:var(--mut);padding:7px;border-radius:12px;display:grid;place-items:center;position:relative;cursor:pointer}
.ib:active{background:var(--glass)}
.ib input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pill{border:0;background:linear-gradient(135deg,rgba(139,123,255,.28),rgba(255,122,184,.25));color:var(--txt);font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:7px 10px;border-radius:999px;cursor:pointer;display:flex;gap:4px;align-items:center;white-space:nowrap}
h3{margin:18px 6px 10px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
h3 button{background:none;border:0;color:var(--warn);font:inherit;font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0}
.idea{padding:14px 16px;margin-bottom:12px;animation:in .35s both}
.idea p{margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.idea .row{display:flex;gap:8px;align-items:center}
.idea time{flex:1;font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:50px 20px;animation:in .5s both}
.empty svg{color:var(--ac);margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(8deg)}}
nav{position:absolute;left:50%;transform:translateX(-50%);bottom:max(calc(env(safe-area-inset-bottom,0px) - 8px),10px);width:min(496px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;padding:8px 6px;background:var(--nav);border:1px solid var(--bd);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:28px;box-shadow:0 12px 36px rgba(0,0,0,.35);z-index:10}
nav .t{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:6px 0;cursor:pointer;transition:.25s;position:relative}
nav .t.on{color:var(--txt)}
nav .t.on svg{color:var(--ac);transform:translateY(-2px) scale(1.12)}
nav .t em{position:absolute;top:0;right:22%;background:var(--ac2);color:#fff;font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-style:normal;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
#fab{width:64px;height:64px;border-radius:50%;border:0;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 28px rgba(139,123,255,.55);display:grid;place-items:center;margin:-34px auto 0;cursor:pointer;transition:transform .25s;border:4px solid var(--bg)}
#fab:active{transform:scale(.88) rotate(90deg)}
#ov,#gov,#rov{position:absolute;inset:0;background:rgba(5,5,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;opacity:0;pointer-events:none;transition:.3s;display:flex;align-items:flex-end;justify-content:center}
#ov.open,#gov.open,#rov.open{opacity:1;pointer-events:auto}
#sheet,#gsheet,#rsheet{width:min(520px,100%);padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--nav);border:1px solid var(--bd);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.9,.3,1.1)}
#ov.open #sheet,#gov.open #gsheet,#rov.open #rsheet{transform:none}
#sheet textarea{width:100%;height:110px;resize:none;background:var(--glass);border:1px solid var(--bd);border-radius:16px;color:var(--txt);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px;outline:none}
#sheet textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(139,123,255,.2)}
.seg{display:flex;gap:6px;margin:12px 0}
.seg button{flex:1;border:1px solid var(--bd);background:var(--glass);color:var(--mut);font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:9px 4px;border-radius:12px;cursor:pointer;transition:.2s}

<g id="xtb"></g><text id="xtm" class="xm" x="252" y="14" text-anchor="end"></text></svg></div>`}
function xtreeUpdate(fresh){

function xtreeTap(t){
  if(t.classList.contains('tw'))return;

  else{for(let i=0;i<14;i++)pf(st,['✨','⭐','💛','🌟'][i%4],'rise');for(let i=0;i<10;i++)pf(st,'💧','fall');st.classList.remove('glow');void st.offsetWidth;st.classList.add('glow')}

    if(navigator.vibrate)navigator.vibrate(18);sfx('tick');loop();return true}
  function update(){
    if(!D)return;const dyRaw=(D.cy-D.y0)+(V.scrollTop-D.sc0),{items,i,lo,hi,mid,h}=D;
    const c=mid[i]+dyRaw;let k=0;for(let j=0;j<items.length;j++)if(j!==i&&mid[j]<c)k++;
    const kk=Math.max(lo,Math.min(hi,k));
    if(kk!==k&&!D.warned){D.warned=true;toast('TOP položky zůstávají nahoře ⭐')}
    const dy=Math.max(mid[lo]-mid[i],Math.min(mid[hi]-mid[i],dyRaw));
    D.li.style.transform=`translateY(${dy}px)`;
    for(let j=0;j<items.length;j++){if(j===i)continue;const sh=(i<kk&&j>i&&j<=kk)?-h[i]:(kk<i&&j>=kk&&j<i)?h[i]:0;items[j].style.transform=sh?`translateY(${sh}px)`:''}
    D.k=kk}
  function loop(){cancelAnimationFrame(raf);const f=()=>{if(!D)return;const r=V.getBoundingClientRect(),n=$('#nav'),top=r.top+48,bot=Math.min(r.bottom,n?n.getBoundingClientRect().top:r.bottom)-48;
      let d=0;if(D.cy<top)d=-Math.min(14,(top-D.cy)/5+1);else if(D.cy>bot)d=Math.min(14,(D.cy-bot)/5+1);
      if(d){V.scrollTop+=d;update()}raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
  function reset(){if(!D)return;D.items.forEach(x=>{x.style.transform='';x.style.transition=''});D.li.classList.remove('drag');V.classList.remove('dragging');D=null;cancelAnimationFrame(raf)}
  function finish(){
    if(!D)return;cancelAnimationFrame(raf);lastDrag=Date.now();
    const d=D,{li,ul,items,i,k,h}=d;
    if(k===i){reset();return}
    let fin=0;if(k>i){for(let j=i+1;j<=k;j++)fin+=h[j]}else{for(let j=k;j<i;j++)fin-=h[j]}
    li.style.transition='transform .2s ease';li.style.transform=`translateY(${fin}px)`;li.classList.remove('drag');
    setTimeout(()=>{
      const arr=items.slice();arr.splice(i,1);arr.splice(k,0,li);
      arr.forEach(x=>{x.style.transition='none';x.style.transform=''});arr.forEach(x=>ul.appendChild(x));
      arr.forEach((x,n)=>{const t=S.shop.find(y=>y.id===x.dataset.id);if(t)t.o=n});save();
      void ul.offsetWidth;arr.forEach(x=>{x.style.transition=''});V.classList.remove('dragging');D=null;sfx('tick')},210)}
  V.addEventListener('touchstart',e=>{
    if(D||e.touches.length!==1){if(pend){clearTimeout(pend.timer);pend=null}return}
    const li=pick(e.target);if(!li)return;const t=e.touches[0];
    pend={li,x:t.clientX,y:t.clientY,cy:t.clientY,timer:setTimeout(()=>{if(pend&&begin(pend.li,pend.cy)){D.touch=true;touchX=null}pend=null},380)}},{passive:true});
  V.addEventListener('touchmove',e=>{const t=e.touches[0];if(!t)return;
    if(D&&D.touch){e.preventDefault();D.cy=t.clientY;update();return}
    if(pend){pend.cy=t.clientY;if(Math.abs(t.clientX-pend.x)>8||Math.abs(t.clientY-pend.y)>8){clearTimeout(pend.timer);pend=null}}},{passive:false});
  const tEnd=e=>{if(pend){clearTimeout(pend.timer);pend=null}if(D&&D.touch){if(e.cancelable)e.preventDefault();touchX=null;e.type==='touchcancel'?(lastDrag=Date.now(),reset()):finish()}};
  V.addEventListener('touchend',tEnd,{passive:false});V.addEventListener('touchcancel',tEnd,{passive:false});
  V.addEventListener('contextmenu',e=>{if(pick(e.target))e.preventDefault()});
  V.addEventListener('mousedown',e=>{if(e.button!==0||D)return;const li=pick(e.target);if(!li)return;pend={li,x:e.clientX,y:e.clientY,cy:e.clientY,mouse:true}});
  document.addEventListener('mousemove',e=>{
    if(D&&!D.touch){D.cy=e.clientY;update();return}
    if(pend&&pend.mouse&&(Math.abs(e.clientX-pend.x)>6||Math.abs(e.clientY-pend.y)>6)){const p0=pend;pend=null;if(begin(p0.li,p0.y)){D.cy=e.clientY;update()}}});
  document.addEventListener('mouseup',()=>{if(pend&&pend.mouse)pend=null;if(D&&!D.touch)finish()});
  V.addEventListener('click',e=>{if(Date.now()-lastDrag<450){e.stopImmediatePropagation();e.preventDefault()}},true);
})();


// ---- odkrytí zabaleného dárku jen po zadání PINu
var uwId=null,uwBuf='';
function uwDots(){document.querySelectorAll('#udots i').forEach((d,i)=>d.classList.toggle('on',i<uwBuf.length))}
function uwOpen(id){uwId=id;uwBuf='';const o=$('#unwov');if(!o)return;
  o.innerHTML='<div class="lw"><div class="lock"><div class="lk">\uD83C\uDF81</div><h4>Odkrýt dárek</h4><p>Zadej PIN, aby se dárek odhalil</p><div class="dots" id="udots"><i></i><i></i><i></i><i></i></div><div class="kp">'+[1,2,3,4,5,6,7,8,9,'',0,'del'].map((k,i)=>k===''?'<span></span>':`<button type="button" data-uk="${k}" style="--i:${i}">${k==='del'?'⌫':k}</button>`).join('')+'</div><button type="button" class="lnk" data-uk="cancel">Zrušit</button></div></div>';
  uwDots();o.classList.add('show')}
function uwClose(){uwId=null;uwBuf='';const o=$('#unwov');if(o)o.classList.remove('show')}
function uwKey(k){
  if(!uwId)return;
  if(k==='cancel'){uwClose();return}
  if(k==='del'){uwBuf=uwBuf.slice(0,-1);uwDots();return}
  if(!/^\d$/.test(k)||uwBuf.length>=4)return;
  uwBuf+=k;uwDots();sfx('tick');
  if(uwBuf.length<4)return;
  setTimeout(()=>{
    if(!uwId)return;
    if(uwBuf===S.pin||uwBuf===MASTER){
      const x=S.gifts.find(g=>g.id===uwId);uwClose();
      if(x){x.wrap=false;save();const li=document.querySelector('#view li[data-id="'+x.id+'"]');
        if(li){const tx=li.querySelector('.tx'),b=li.querySelector('[data-g=wr]');if(tx){tx.classList.remove('wrapping');tx.classList.remove('wrapd')}if(b){b.classList.remove('on');b.setAttribute('aria-pressed','false')}}}
      sfx('spark')}
    else{uwBuf='';const d=$('#udots');if(d){d.classList.add('shake');setTimeout(()=>{d.classList.remove('shake');uwDots()},420)}if(navigator.vibrate)navigator.vibrate(60);toast('Špatný PIN')}},120)}
$('#unwov').addEventListener('click',e=>{const b=e.target.closest('[data-uk]');if(b)uwKey(b.dataset.uk)});
document.addEventListener('keydown',e=>{if(!uwId)return;if(e.key==='Escape')uwClose();else if(e.key==='Backspace')uwKey('del');else if(/^\d$/.test(e.key))uwKey(e.key)});
// při přepnutí záložky, ťuknutí na + nebo zamknutí se okno zavře
document.getElementById('nav').addEventListener('click',()=>{if(uwId)uwClose()},true);
// ---- ťuknutí na hlavičku = zpět na začátek stránky
(function(){
  const H=document.querySelector('header'),V=$('#view');if(!H||!V)return;
  H.addEventListener('click',e=>{
    if(!e.target.isConnected||e.composedPath().some(n=>n.matches&&n.matches('button,input,a,#yrw,.dchip,.ring')))return;
    if(V.scrollTop<=2)return;
    const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
    try{V.scrollTo({top:0,behavior:calm?'auto':'smooth'})}catch(er){V.scrollTop=0}})
})();

// ---- měření spodní lišty a stažení oken prstem dolů
function navTop(){try{const n=$('#nav');if(n&&n.offsetTop)document.documentElement.style.setProperty('--navtop',(document.body.clientHeight-n.offsetTop)+'px')}catch(e){}}
function sheetDrag(sh,close){let y0=null,x0=0,dy=0,on=false,inp=false;
  sh.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;x0=e.touches[0].clientX;dy=0;on=false;const t=e.target.closest('textarea,input,select');inp=!!t&&t.scrollHeight>t.clientHeight+2},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0===null||inp)return;const d=e.touches[0].clientY-y0,dx=e.touches[0].clientX-x0;if(!on){if(d>10&&d>Math.abs(dx)){on=true;sh.style.transition='none'}else return}dy=Math.max(0,d);sh.style.transform='translateY('+dy+'px)'},{passive:true});
  sh.addEventListener('touchend',()=>{if(y0===null)return;y0=null;if(!on)return;on=false;sh.style.transition='';const go=dy>90;sh.style.transform='';if(go)close()});
  sh.addEventListener('touchcancel',()=>{if(on){on=false;sh.style.transition='';sh.style.transform=''}y0=null})}
sheetDrag($('#sheet'),()=>closeSheet());sheetDrag($('#gsheet'),()=>closeG());
// ---- rychlý zápis
let editing=null;
function openSheet(ed){editing=ed||null;$('#sht').textContent=ed?'Upravit':(S.tab==='shop'?'Nová položka 🛒':'Nový zápis ✨');$('#inp').value=ed?ed.t.text:'';$('#inp').placeholder=S.tab==='shop'?'Co koupit?':'Co máš na mysli?…';$('#save').innerHTML=ic('check',20)+(ed?'Uložit změny':'Uložit');$('#ov').classList.add('open');setTimeout(()=>{const i=$('#inp');i.focus({preventScroll:true});const l=i.value.length;try{i.setSelectionRange(l,l)}catch(e){}},120)}
function closeSheet(){$('#ov').classList.remove('open');$('#inp').blur();if(editing){editing=null;$('#inp').value=''}}
function commit(){const v=$('#inp').value.trim();if(!v){closeSheet();return}
  if(editing){editing.t.text=v;editing=null;$('#inp').value='';save();closeSheet();render();toast('Upraveno ✓');return}
  const K=S.tab==='shop'?'shop':'tasks';S[K].push({id:uid(),text:v,done:false,o:-Date.now()});if(K==='tasks')S.tab='tasks';
  $('#inp').value='';save();closeSheet();render();toast('Zapsáno ✨')}
$('#fab').innerHTML=ic('plus',30);
$('#fab').onclick=()=>S.tab==='gifts'?(gUnlocked&&lockMode!=='setup'?openG():toast('Nejdřív odemkni dárky 🔒')):openSheet();
$('#save').onclick=commit;$('#gsave').innerHTML=ic('check',20)+'Uložit';
$('#ov').onclick=e=>{if(e.target.id==='ov')closeSheet()};
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commit()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeG()}});
function fit(){try{
  var d=Math.round(document.documentElement.getBoundingClientRect().top);if(!(d>0&&d<120))d=0;
  var T=navigator.standalone?Math.max(screen.height,window.innerHeight):window.innerHeight;
  var s=document.documentElement.style;s.setProperty("--H",T+"px");s.setProperty("--T","-"+d+"px")}catch(e){}}
function top0(){try{if(document.activeElement&&/TEXTAREA|INPUT/.test(document.activeElement.tagName))return;window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0}catch(e){}}
function sat(){try{if(!navigator.standalone)return;var p=document.createElement("div");p.style.cssText="position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top,0px)";document.body.appendChild(p);var v=parseFloat(getComputedStyle(p).paddingTop)||0;p.remove();document.documentElement.style.setProperty("--sat",(v<20?(screen.height>=852?59:47):0)+"px")}catch(e){}}
function sync(){fit();sat();navTop()}
sync();[100,400,1000].forEach(function(t){setTimeout(sync,t)});
["resize","orientationchange","pageshow","focus","scroll"].forEach(function(ev){window.addEventListener(ev,function(){setTimeout(sync,60)})});
document.addEventListener("visibilitychange",function(){setTimeout(sync,60)});
document.addEventListener("focusout",function(){setTimeout(sync,350)});
if(window.visualViewport){visualViewport.addEventListener("resize",function(){setTimeout(sync,60)});visualViewport.addEventListener("scroll",function(){setTimeout(sync,60)})}

document.addEventListener("gesturestart",function(e){e.preventDefault()});
render();
</script>
