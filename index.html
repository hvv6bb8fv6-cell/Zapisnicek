<title>Zápisník</title>
<style>
:root{--bg:#0e0f23;--txt:#f1f1fa;--mut:#a3a5c4;--glass:rgba(255,255,255,.08);--bd:rgba(255,255,255,.15);--ac:#8b7bff;--ac2:#ff7ab8;--ok:#5be3b0;--warn:#ff8a7a;--nav:rgba(20,21,48,.72)}
[data-theme=light]{--bg:#f2f0ff;--txt:#23244a;--mut:#6b6d95;--glass:rgba(255,255,255,.62);--bd:rgba(255,255,255,.95);--nav:rgba(255,255,255,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;background:var(--bg);height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{margin:0;position:absolute;top:var(--T,0px);left:0;right:0;height:var(--H,100%);overflow:hidden}
input,textarea,select{font-size:16px}
label.ib{overflow:hidden;flex:none}
.ib input{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.pill{position:relative;z-index:2}
body{background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;transition:background .4s}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;animation:drift 18s ease-in-out infinite alternate}
.b1{width:300px;height:300px;background:#6a5cff;top:-80px;left:-80px}
.b2{width:280px;height:280px;background:#ff5fa8;bottom:80px;right:-100px;animation-delay:-6s}
.b3{width:240px;height:240px;background:#2fd3c0;top:40%;left:-120px;animation-delay:-11s;opacity:.35}
[data-theme=light] .blob{opacity:.4}
@keyframes drift{to{transform:translate(60px,50px) scale(1.15)}}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:calc(max(env(safe-area-inset-top,0px),var(--sat,0px)) + 14px) 22px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:28px;letter-spacing:-.5px}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
.ring{position:relative;width:54px;height:54px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px}
main{flex:1;overflow-y:auto;padding:8px 16px 150px;-webkit-overflow-scrolling:touch}
.glass{background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
ul{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:8px;padding:10px 8px;margin-bottom:10px;animation:in .35s cubic-bezier(.2,.9,.3,1.2) both;position:relative;transition:opacity .4s,transform .4s}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.96)}}
.task.drag{z-index:5;box-shadow:0 16px 40px rgba(0,0,0,.4);transition:none;scale:1.03}
.task.out{opacity:0;transform:translateX(40px) scale(.9)}
.grip{touch-action:none;color:var(--mut);padding:6px 2px;cursor:grab;display:grid}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);background:none;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;transition:.25s}
.chk svg{opacity:0;transform:scale(.3);transition:.3s cubic-bezier(.2,1.6,.4,1)}
.done .chk,.chk.on{background:linear-gradient(135deg,var(--ok),#2fd3c0);border-color:transparent;box-shadow:0 0 0 6px rgba(91,227,176,.18)}
.done .chk svg,.chk.on svg{opacity:1;transform:none}
.tx{flex:1;min-width:0;word-break:break-word;padding:2px 2px}
.tx small{display:block;font-size:12px;color:var(--ac);margin-top:1px}
.tx small.late{color:var(--warn)}
.done .tx{text-decoration:line-through;color:var(--mut)}
.ib{background:none;border:0;color:var(--mut);padding:7px;border-radius:12px;display:grid;place-items:center;position:relative;cursor:pointer}
.ib:active{background:var(--glass)}
.ib input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pill{border:0;background:linear-gradient(135deg,rgba(139,123,255,.28),rgba(255,122,184,.25));color:var(--txt);font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:7px 10px;border-radius:999px;cursor:pointer;display:flex;gap:4px;align-items:center;white-space:nowrap}
h3{margin:18px 6px 10px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
h3 button{background:none;border:0;color:var(--warn);font:inherit;font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0}
.idea{padding:14px 16px;margin-bottom:12px;animation:in .35s both}
.idea p{margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.idea .row{display:flex;gap:8px;align-items:center}
.idea time{flex:1;font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:50px 20px;animation:in .5s both}
.empty svg{color:var(--ac);margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(8deg)}}
nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(496px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;padding:8px 6px;background:var(--nav);border:1px solid var(--bd);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:28px;box-shadow:0 12px 36px rgba(0,0,0,.35);z-index:10}
nav .t{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:6px 0;cursor:pointer;transition:.25s;position:relative}
nav .t.on{color:var(--txt)}
nav .t.on svg{color:var(--ac);transform:translateY(-2px) scale(1.12)}
nav .t em{position:absolute;top:0;right:22%;background:var(--ac2);color:#fff;font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-style:normal;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
#fab{width:64px;height:64px;border-radius:50%;border:0;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 28px rgba(139,123,255,.55);display:grid;place-items:center;margin:-34px auto 0;cursor:pointer;transition:transform .25s;border:4px solid var(--bg)}
#fab:active{transform:scale(.88) rotate(90deg)}
#ov,#gov,#rov{position:absolute;inset:0;background:rgba(5,5,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;opacity:0;pointer-events:none;transition:.3s;display:flex;align-items:flex-end;justify-content:center}
#ov.open,#gov.open,#rov.open{opacity:1;pointer-events:auto}
#sheet,#gsheet,#rsheet{width:min(520px,100%);padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--nav);border:1px solid var(--bd);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.9,.3,1.1)}
#ov.open #sheet,#gov.open #gsheet,#rov.open #rsheet{transform:none}
#sheet textarea{width:100%;height:110px;resize:none;background:var(--glass);border:1px solid var(--bd);border-radius:16px;color:var(--txt);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px;outline:none}
#sheet textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(139,123,255,.2)}
.seg{display:flex;gap:6px;margin:12px 0}
.seg button{flex:1;border:1px solid var(--bd);background:var(--glass);color:var(--mut);font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:9px 4px;border-radius:12px;cursor:pointer;transition:.2s}
.seg button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
#save,#gsave,#rsave{width:100%;border:0;padding:14px;border-radius:16px;font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center}
#save:active,#gsave:active,#rsave:active{transform:scale(.97)}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);transform:translate(-50%,20px);background:var(--nav);border:1px solid var(--bd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:30;display:flex;gap:12px;align-items:center;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--ac);font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;cursor:pointer;padding:0}
.cf{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:40;animation:cf .8s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.flash{animation:fl .6s}
@keyframes fl{30%{box-shadow:0 0 0 3px var(--ok),0 0 30px var(--ok)}}

.hr{display:flex;align-items:center;gap:4px}.ring:empty{display:none}
.blob{transition:background 1s}
body.xmas{--ac:#ff6b6b;--ac2:#4fd18b}
.xmas .b1{background:#c92a3a}.xmas .b3{background:#1fa66a;opacity:.5}.xmas .b2{background:#e0a93b}
.snow{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;display:none}
.xmas:not(.nosnow) .snow{display:block}
[hidden]{display:none!important}
#snowbtn{font-size:20px;color:#bfe6ff;transition:opacity .3s}
#snowbtn.off{opacity:.35;text-decoration:line-through}
.snow i{position:absolute;top:-30px;font-style:normal;color:#fff;animation:fall linear infinite}
@keyframes fall{to{transform:translate(40px,105vh) rotate(360deg)}}
.cf.em{width:auto;height:auto;background:none;font-size:18px;font-style:normal;animation-duration:1.05s}
.gsum{padding:16px;margin-bottom:6px;animation:in .4s both}
.gbud{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px}
.gbud div{display:flex;align-items:center;gap:6px}.gbud b{color:var(--txt)}
.gbud input{width:120px;text-align:right;background:var(--glass);border:1px solid var(--bd);border-radius:12px;color:var(--txt);font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:8px 10px;outline:none}
.gbar{height:12px;border-radius:6px;background:rgba(128,128,160,.22);margin:14px 0;display:flex;overflow:hidden}
.gbar i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.9,.3,1)}
#bsp{background:linear-gradient(90deg,#2fbf71,#5be3b0)}
#bpl{background:repeating-linear-gradient(45deg,#ff6b81 0 6px,#ff8fa0 6px 12px)}
.gst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.gst small{display:block;color:var(--mut);font-size:11px}.gst b{font-size:15px;white-space:nowrap}
.ok{color:var(--ok)}.pk{color:#ff8fa0}.gst .neg b{color:var(--warn)}
#gnote{margin:12px 0 0;text-align:center;font-size:13px;color:var(--mut)}
.gok{color:var(--ok)!important}
h3 span{color:#ff8fa0;text-transform:none;letter-spacing:0;font-size:13px}
#gsheet h2{margin:0 0 12px;font-size:19px}
#gsheet input:not([type=checkbox]){width:100%;margin-bottom:10px;background:var(--glass);border:1px solid var(--bd);border-radius:14px;color:var(--txt);font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:13px 14px;outline:none}
#gsheet input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(255,107,107,.2)}
.gb{display:flex;gap:10px;align-items:center;margin:2px 2px 14px;color:var(--mut)}
.gb input{width:22px;height:22px;accent-color:#2fbf71}

#rsheet h2{margin:0 0 6px;font-size:19px}
#rsheet p{margin:0 0 14px;font-weight:600;color:var(--mut);word-break:break-word}
#rsheet label{display:block;color:var(--mut);font-size:13px;margin-bottom:12px}
#rsheet input,#rsheet select{display:block;width:100%;margin-top:6px;background:var(--glass);border:1px solid var(--bd);border-radius:14px;color:var(--txt);font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:13px 14px;outline:none;min-height:50px}
#rsheet option{color:#23244a}

.dchip{display:flex;align-items:center;gap:4px;background:var(--glass);border:1px solid var(--bd);padding:5px 10px;border-radius:999px;font-weight:700;font-size:15px;color:#ffd36b;margin-right:4px}
.dchip.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.3)}}
.fx{position:fixed;z-index:50;pointer-events:none;display:flex;align-items:center;gap:2px;font-weight:800;color:#ffd36b;animation:fup 1.1s ease-out forwards}
@keyframes fup{to{transform:translateY(-70px);opacity:0}}
.task.star{border-color:rgba(255,211,107,.7);background:linear-gradient(135deg,rgba(255,211,107,.2),var(--glass));box-shadow:0 0 0 1px rgba(255,211,107,.4),0 8px 28px rgba(255,170,60,.25)}
.pill.on{background:linear-gradient(135deg,#ffd36b,#ff9f5a);color:#3a2300}
.task{padding-left:12px}
.pcard{padding:14px;margin-bottom:8px;animation:in .4s both}
.pcard h4{margin:0 0 4px;font-size:18px}.pcard p{margin:0;color:var(--mut);font-size:14px}
.pname{display:flex;justify-content:space-between;align-items:center}.pname b{font-size:20px}
.pname span{background:linear-gradient(135deg,rgba(255,200,120,.35),rgba(255,122,184,.3));padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.stage{position:relative;height:270px;margin:10px 0;border-radius:24px;overflow:hidden;background:linear-gradient(#bfe6ff,#ffe9f6 62%,#d6f5c9 62%)}
.stage::before{content:'';position:absolute;top:26px;left:-90px;width:80px;height:26px;border-radius:20px;background:#fff;box-shadow:30px -10px 0 6px #fff;opacity:.85;animation:cloud 28s linear infinite}
.stage::after{content:'';position:absolute;left:-15%;right:-15%;bottom:-44px;height:112px;border-radius:50%;background:#b9ecab}
.stage.glow{animation:glow 1.4s}
@keyframes glow{40%{box-shadow:inset 0 0 60px 10px rgba(255,214,102,.8)}}
@keyframes cloud{to{transform:translateX(560px)}}
.pet{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.pet svg{width:230px;height:244px;margin-top:12px;overflow:visible;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
.pet.hop svg{animation:hop .6s}
@keyframes bob{50%{transform:translateY(-5px) scale(1.015,.985)}}
@keyframes hop{30%{transform:translateY(-22px) scale(1.05,.95)}60%{transform:translateY(0) scale(.96,1.04)}}
.wag{transform-box:fill-box;transform-origin:0% 100%;animation:wag .8s ease-in-out infinite alternate}
@keyframes wag{to{transform:rotate(14deg)}}
.bloom{animation:sway 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{to{transform:rotate(4deg)}}
.bub{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:7;background:#fff;color:#3b2a4a;padding:8px 14px;border-radius:16px;font-weight:600;font-size:14px;max-width:84%;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.bub::after{content:'';position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.bub.show{animation:popb .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes popb{from{transform:translateX(-50%) scale(.4);opacity:0}}
.pf{position:absolute;z-index:6;pointer-events:none;font-style:normal;font-size:18px;animation:pf 1.5s ease-out forwards}
.pf.big{font-size:30px}
@keyframes pf{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.xpbar{height:10px;border-radius:5px;background:rgba(128,128,160,.25);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#8bf0b4,#ffe27a);transition:width .8s}
.xptx,.phint{text-align:center;font-size:12px;color:var(--mut);margin-top:6px}
.pdone{text-align:center;font-weight:700;margin:12px 0 4px;color:var(--ok)}
.prow{display:flex;gap:10px;margin-top:12px}
.pbtn{flex:1;border:1px solid var(--bd);background:var(--glass);color:var(--txt);font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 8px;border-radius:16px;cursor:pointer;display:flex;gap:6px;justify-content:center;align-items:center;transition:transform .2s}
.pbtn:active{transform:scale(.95)}
.pbtn.gold{width:100%;margin-top:10px;background:linear-gradient(135deg,#ffe27a,#ffa63d);color:#4a2c00;border:0;box-shadow:0 8px 22px rgba(255,166,61,.4)}
.pbtn.gold em{background:rgba(255,255,255,.55);border-radius:10px;padding:1px 8px;font-style:normal}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pick{position:relative;padding:10px 8px 12px;text-align:center;color:var(--txt);cursor:pointer;font-family:inherit;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:in .4s both}
.pick svg{width:100%;max-width:130px;height:auto;overflow:visible}
.pick:active{transform:scale(.96)}.pick small{color:var(--mut);font-size:11px}
.pick.lock::after{content:'🔒';position:absolute;top:6px;right:8px;font-size:13px;opacity:.7}
.pick.lock{cursor:pointer}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="snow" id="snow"></div>
<div id="app">
  <header><div><h1 id="ttl"></h1><p id="sub"></p></div><div class="hr"><div class="dchip" id="drops"></div><button id="snowbtn" class="ib" hidden aria-label="Sníh">❄</button><button id="theme" class="ib" aria-label="Motiv"></button><div class="ring" id="ring"></div></div></header>
  <main id="view"></main>
</div>
<nav id="nav">
  <button class="t" data-t="tasks"></button>
  <button class="t" data-t="shop"></button>
  <button id="fab" aria-label="Rychlý zápis"></button>
  <button class="t" data-t="gifts"></button>
  <button class="t" data-t="garden"></button>
</nav>
<div id="ov"><div id="sheet">
  <textarea id="inp" placeholder="Co máš na mysli?…" enterkeyhint="done"></textarea>
  <button id="save"></button>
</div></div>
<div id="gov"><div id="gsheet">
  <h2 id="gt">Nový dárek 🎁</h2>
  <input id="gn" type="text" placeholder="Pro koho? (např. Maminka)" autocomplete="off" list="gnames">
  <datalist id="gnames"></datalist>
  <input id="gg" type="text" placeholder="Co koupit? (např. Parfém)" autocomplete="off">
  <input id="gp" type="number" inputmode="numeric" placeholder="Cena v Kč">
  <label class="gb"><input type="checkbox" id="gb"> Už koupeno</label>
  <button id="gsave"></button>
</div></div>
<div id="toast"><span id="tmsg"></span><button id="tund" hidden>Zpět</button></div>

<script>
const $=s=>document.querySelector(s);
const P={cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/>',
 sprout:'<path d="M7 20h10M10 20c5.5-2.5.8-6.4 3-10M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8zM14.1 6a7 7 0 00-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 layers:'<path d="M12 2l10 5-10 5L2 7z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>',
 bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0012 2z"/>',
 check:'<path d="M20 6L9 17l-5-5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 grip:'<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
 right:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 left:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 bell:'<path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/>',
 gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 01-2 2H7a2 2 0 01-2-2v-7M7.5 8a2.5 2.5 0 010-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 010 5"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'
};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const KEY='zapisnik.v1';
let S={tasks:[],ideas:[],gifts:[],budget:0,shop:[],drops:0,pet:null,coll:[],tab:'tasks',theme:'dark'};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const DN=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
const MN=['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function dlabel(s){
  const t=iso(new Date()),tm=iso(new Date(Date.now()+864e5));
  if(s<t)return{t:'Po termínu · '+fmt(s),c:'late'};
  if(s===t)return{t:'Dnes',c:''};
  if(s===tm)return{t:'Zítra',c:''};
  return{t:fmt(s),c:''};
}
const fmt=s=>{const[y,m,d]=s.split('-');return +d+'. '+(+m)+'.'};
const ago=ts=>{const m=Math.round((Date.now()-ts)/6e4);if(m<1)return'právě teď';if(m<60)return`před ${m} min`;const h=Math.round(m/60);if(h<24)return`před ${h} h`;return new Date(ts).getDate()+'. '+(new Date(ts).getMonth()+1)+'.'};


function migrate(){
  if(S.v>=2)return;
  (S.ideas||[]).forEach(i=>S.tasks.push({id:i.id,text:i.text,done:false,o:-(i.ts||Date.now())}));
  S.ideas=[];S.tasks.forEach(t=>{if(t.list==='today'&&!t.done)t.star=true;t.paid=true});
  S.v=2;save()}
migrate();if(!['tasks','shop','gifts','garden'].includes(S.tab))S.tab='tasks';
const empty=(t,s)=>`<div class="empty">${ic('spark',44)}<div><b>${t}</b></div><div>${s}</div></div>`;
const drop=s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe27a"/><stop offset="1" stop-color="#ffa63d"/></linearGradient></defs><path d="M12 2.5C12 2.5 5 10 5 15a7 7 0 0014 0c0-5-7-12.5-7-12.5z" fill="url(#gd)"/><path d="M9 15a3 3 0 003 3" stroke="#fff" stroke-opacity=".75" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
function chip(b){const c=$('#drops');c.innerHTML=drop(18)+'<b>'+S.drops+'</b>';if(b){c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}}
function dropFx(el){const r=el.getBoundingClientRect(),i=document.createElement('div');i.className='fx';i.style.left=r.left+'px';i.style.top=r.top+'px';i.innerHTML='+1 '+drop(20);document.body.appendChild(i);setTimeout(()=>i.remove(),1150);chip(true)}
const srt=(a,b)=>(b.star?1:0)-(a.star?1:0)||a.o-b.o;
function tHTML(t,shop){return `<li class="task glass ${t.done?'done':''} ${t.star&&!t.done?'star':''}" data-id="${t.id}"><button class="chk" data-a="tg" aria-label="Hotovo">${ic('check',16)}</button><div class="tx" data-a="ed">${esc(t.text)}</div>${shop||t.done?'':`<button class="pill ${t.star?'on':''}" data-a="st">${ic('sun',13)} Dnes</button>`}<button class="ib" data-a="rm" aria-label="Smazat">${ic('x',18)}</button></li>`}
function listHTML(K){
  const shop=K==='shop',open=S[K].filter(t=>!t.done).sort(srt),done=S[K].filter(t=>t.done);
  let h=open.length?`<ul>${open.map(t=>tHTML(t,shop)).join('')}</ul>`:empty(shop?'Nákupní seznam je prázdný':'Čistý stůl',shop?'Klepni na + a přidej, co chceš koupit.':'Klepni na + a zapiš úkol nebo myšlenku.');
  if(done.length)h+=`<h3>${shop?'V košíku':'Hotovo'} (${done.length})<button data-a="clr">${shop?'Vysypat košík':'Smazat hotové'}</button></h3><ul>${done.map(t=>tHTML(t,shop)).join('')}</ul>`;
  return h}
function render(){
  const T=S.tab,now=new Date();
  document.documentElement.dataset.theme=S.theme;
  document.body.classList.toggle('xmas',T==='gifts');document.body.classList.toggle('nosnow',S.snow===false);
  $('#snowbtn').hidden=T!=='gifts';$('#snowbtn').classList.toggle('off',S.snow===false);
  $('#theme').innerHTML=ic(S.theme==='dark'?'sun':'moon');chip();$('#ring').innerHTML='';
  const op=S.tasks.filter(t=>!t.done),ns=op.filter(t=>t.star).length;
  $('#ttl').textContent={tasks:'Úkoly & Myšlenky',shop:'Nákupy',gifts:'Dárky 🎄',garden:'Zahrádka 🌷'}[T];
  $('#sub').textContent=T==='tasks'?`Otevřeno: ${op.length}${ns?' · Dnes: '+ns:''}`:T==='shop'?'Odškrtni a získej zlatou kapku 💧':T==='gifts'?xsub(now):'Pečuj o svého kamaráda';
  const cnt={tasks:op.length,shop:S.shop.filter(t=>!t.done).length,gifts:S.gifts.filter(x=>!x.bought).length,garden:S.pet&&!S.pet.done?S.drops:0};
  const lab={tasks:['check','Úkoly'],shop:['cart','Nákupy'],gifts:['gift','Dárky'],garden:['sprout','Zahrada']};
  document.querySelectorAll('nav .t[data-t]').forEach(b=>{const k=b.dataset.t;b.classList.toggle('on',k===T);b.innerHTML=ic(lab[k][0])+lab[k][1]+(cnt[k]?`<em>${cnt[k]}</em>`:'')});
  $('#view').innerHTML=T==='gifts'?giftsHTML():T==='garden'?gardenHTML():listHTML(T);
  if(T==='gifts')giftsFX();
}
$('#view').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const li=b.closest('[data-id]'),a=b.dataset.a,K=S.tab==='shop'?'shop':'tasks',arr=S[K],t=li&&arr.find(x=>x.id===li.dataset.id);
  if(a==='tg'&&t){t.done=!t.done;
    if(t.done){t.star=false;if(!t.paid){t.paid=true;S.drops++;dropFx(b)}save();li.classList.add('done','flash');b.classList.add('on');confetti(b);setTimeout(()=>li.classList.add('out'),350);setTimeout(render,700)}
    else{save();render()}}
  if(a==='st'&&t){t.star=!t.star;t.o=-Date.now();save();li.classList.add('flash');setTimeout(render,260)}
  if(a==='ed'&&t&&!t.done){const v=prompt('Upravit',t.text);if(v&&v.trim()){t.text=v.trim();save();render()}}
  if(a==='rm'&&t){const i=arr.indexOf(t);li.classList.add('out');setTimeout(()=>{arr.splice(i,1);save();render();toast('Smazáno',()=>{arr.splice(i,0,t);save();render()})},300)}

  return `<div class="pcard glass"><div class="pname"><b>${pname(p)}</b><span id="plbl">${LBL[p.kind][st]}</span></div><div class="stage" id="stage"><div class="pet" id="pet">${petSVG(p,st)}</div><div class="bub" id="bub" hidden></div></div><div class="xpbar"><i id="xpb" style="width:${x.pct}%"></i></div><div class="xptx" id="xptx">${x.tx}</div>`+
  (p.done?`<div class="pdone">Uloženo do sbírky 🏆</div><button class="pbtn gold" data-p="new">${pl?'🌱 Zasadit novou kytičku':'🐾 Adoptovat nové zvířátko'}</button>`
  :`<div class="prow">${pl?'<button class="pbtn" data-p="free">💦 Zalít jen tak</button>':'<button class="pbtn" data-p="pet">🤗 Podrbat</button><button class="pbtn" data-p="feed">🍪 Nakrmit</button>'}</div><button class="pbtn gold" data-p="prem">${drop(20)} Prémiová péče <em id="pcnt">${S.drops}</em></button><div class="phint">Péče pro radost je zdarma a dává trochu XP. Zlaté kapky získáš za splněné úkoly a nákupy.</div>`)+`</div>`}
function chooserHTML(){const c=(k,sp,svg,n)=>`<button class="pick glass" data-p="pick" data-k="${k}" data-sp="${sp}"><div>${svg}</div><b>${n}</b></button>`;
  return `<div class="pcard glass"><h4>Koho chceš pěstovat? 💛</h4><p>Vyber si kytičku nebo zvířátko, o které se budeš starat.</p></div><h3>Kytičky</h3><div class="pgrid">${Object.keys(PL).map(s=>c('plant',s,plantSVG(s,3),PL[s].n)).join('')}</div><h3>Zvířátka</h3><div class="pgrid">${Object.keys(AN).map(s=>c('animal',s,animalSVG(s,3),AN[s].n)).join('')}</div>`}
function galleryHTML(){const c=(k,sp,n)=>`<div class="pick glass lock" data-p="peek" data-k="${k}" data-sp="${sp}" data-st="3"><div>${petSVG({kind:k,sp},3)}</div><b>${n}</b><small>ťukni a uvidíš růst</small></div>`;
  return `<h3>Galerie · odemkne se, až kamarád vyroste</h3><div class="pgrid">${Object.keys(PL).map(s=>c('plant',s,PL[s].n)).join('')}${Object.keys(AN).map(s=>c('animal',s,AN[s].n)).join('')}</div>`}
function gardenHTML(){
  let h=S.pet?petHTML():chooserHTML();
  if(S.pet&&!S.pet.done)h+=galleryHTML();
  h+=`<h3>Sbírka (${S.coll.length})</h3>`+(S.coll.length?`<div class="pgrid">${S.coll.map(c=>{const d=new Date(c.ts);return `<div class="pick glass"><div>${petSVG(c,3)}</div><b>${pname(c)}</b><small>${d.getDate()}. ${d.getMonth()+1}.</small></div>`}).join('')}</div>`:`<div class="empty" style="padding:24px">Zatím prázdná. Až první kamarád vyroste, objeví se tady 🏆</div>`);
  return h}
const MSG={plant:["Mám tě rád! 🥰","Dneska ti to moc sluší! ✨","Ach, to je osvěžení! 💦","Cítím, jak rostu! 🌱","Jsi nejlepší zahradnice! 🌷","Sluníčko a ty, dokonalá dvojka ☀️","Šimrá to, hihi! 😆","Díky, že na mě myslíš 💕","Dneska je krásný den! 🌈","Ještě trochu a rozkvetu! 🌸","S tebou se mi roste skvěle! 💚","Máš zlatou ruku! 🏅"],
 pet:["Mám tě rád! 🥰","{s}, to je příjemné! 🐾","Ty jsi nejlepší! 💖","Ještě kousek za uchem! 😻","Dneska ti to moc sluší! ✨","Hřeješ jako sluníčko ☀️","Jsem nejšťastnější na světě! 🌟","Pojď si se mnou hrát! 🎾","Tolik tě mám rád! 💕","Mazlení je moje oblíbené! 🤗"],
 feed:["{s}, to bylo dobré! 🐾","Mňam mňam! 😋","Dobrou chuť nám oběma! 🍽️","Přesně to jsem chtěl! 😍","Ještě jedno sousto? 🥕","Bříško je spokojené! 😊","Nejlepší kuchařka široko daleko! 👩‍🍳","Děkuju, jsem sytý a šťastný! 💛"],
 prem:["Wow, to je nejlepší dárek! 🌟","Cítím se úplně nový! ✨","Zlatá péče, to je luxus! 👑","Rostu jako z vody! 🚀","Děkuju z celého srdce! 💛"]};
const BAGS={};let bt;
function pickMsg(k){if(!BAGS[k]||!BAGS[k].length)BAGS[k]=[...MSG[k]].sort(()=>Math.random()-.5);return BAGS[k].pop().replace('{s}',S.pet&&S.pet.kind==='animal'?AN[S.pet.sp].s:'Hurá')}
function say(t){const b=$('#bub');if(!b)return;b.textContent=t;b.hidden=false;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');clearTimeout(bt);bt=setTimeout(()=>{b.hidden=true},2800)}
function pf(st,ch,mode,big){const i=document.createElement('i');i.className='pf'+(big?' big':'');i.textContent=ch;const x=st.clientWidth*(.2+Math.random()*.6);
  i.style.cssText=mode==='fall'?`left:${x}px;top:-10px;--dx:${(Math.random()-.5)*30}px;--dy:210px;animation-delay:${Math.random()*.6}s`:`left:${x}px;top:150px;--dx:${(Math.random()-.5)*90}px;--dy:-${90+Math.random()*60}px;animation-delay:${Math.random()*.4}s`;
  st.appendChild(i);setTimeout(()=>i.remove(),2300)}
function fx(type){const st=$('#stage');if(!st)return;
  if(type==='free')for(let i=0;i<12;i++)pf(st,'💧','fall');
  else if(type==='pet')for(let i=0;i<9;i++)pf(st,'❤️','rise');
  else if(type==='feed')for(let i=0;i<8;i++)pf(st,['🍪','🥕','🍓'][i%3],'fall');
  else{for(let i=0;i<14;i++)pf(st,['✨','⭐','💛','🌟'][i%4],'rise');for(let i=0;i<10;i++)pf(st,'💧','fall');st.classList.remove('glow');void st.offsetWidth;st.classList.add('glow')}
  pf(st,['😊','🥰','😍','🤗','😻','😄'][Math.random()*6|0],'rise',true);
  const pe=$('#pet');pe.classList.remove('hop');void pe.offsetWidth;pe.classList.add('hop')}
function addXp(n){const p=S.pet;if(!p||p.done)return null;const before=stOf(p.xp);p.xp=Math.min(150,p.xp+n);const after=stOf(p.xp);
  if(p.xp>=150){p.done=true;S.coll.push({kind:p.kind,sp:p.sp,ts:Date.now()})}return{before,after,done:!!p.done}}
function care(a){const p=S.pet;if(!p||p.done)return;let res=null;
  if(a==='prem'){if(S.drops<1){toast('Zlaté kapky získáš za úkoly a nákupy 💧');return}S.drops--;res=addXp(45);fx('prem');say(pickMsg('prem'))}
  else{const t=Date.now();if(t-(p.last||0)>12000){p.last=t;res=addXp(3)}fx(a);say(pickMsg(a==='free'?'plant':a))}
  save();chip(a==='prem');
  if($('#pcnt'))$('#pcnt').textContent=S.drops;
  const x=pxp(p);$('#xpb').style.width=x.pct+'%';$('#xptx').textContent=x.tx;
  if(res&&res.after>res.before){$('#pet').innerHTML=petSVG(p,res.after);$('#plbl').textContent=LBL[p.kind][res.after];const s=$('#stage');confetti(s);for(let i=0;i<16;i++)pf(s,['⭐','✨','🎉'][i%3],'rise');toast('Nová fáze: '+LBL[p.kind][res.after]+' 🎉')}
  if(res&&res.done){const s=$('#stage');setTimeout(()=>confetti(s),400);setTimeout(()=>confetti(s),900);toast('Hurá! Uloženo do sbírky 🏆');setTimeout(render,2400)}}
$('#view').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const a=b.dataset.p;
  if(a==='pick'){S.pet={kind:b.dataset.k,sp:b.dataset.sp,xp:0,last:0};save();render();setTimeout(()=>{say('Ahoj! 👋 Jsem tvůj nový kamarád!');fx('prem')},150)}
  else if(a==='new'){S.pet=null;save();render()}
  else if(a==='peek'){const n=((+b.dataset.st)+1)%4,o={kind:b.dataset.k,sp:b.dataset.sp};b.dataset.st=n;b.querySelector('div').innerHTML=petSVG(o,n);b.querySelector('small').textContent='Fáze: '+LBL[o.kind][n]}
  else care(a)});

// ---- rychlý zápis
function openSheet(){$('#inp').placeholder=S.tab==='shop'?'Co koupit?':'Co máš na mysli?…';$('#save').innerHTML=ic('check',20)+'Uložit';$('#ov').classList.add('open');setTimeout(()=>$('#inp').focus(),120)}
function closeSheet(){$('#ov').classList.remove('open');$('#inp').blur()}
function commit(){const v=$('#inp').value.trim();if(!v){closeSheet();return}
  const K=S.tab==='shop'?'shop':'tasks';S[K].push({id:uid(),text:v,done:false,o:-Date.now()});if(K==='tasks')S.tab='tasks';
  $('#inp').value='';save();closeSheet();render();toast('Zapsáno ✨')}
$('#fab').innerHTML=ic('plus',30);
$('#fab').onclick=()=>S.tab==='gifts'?openG():openSheet();
$('#save').onclick=commit;$('#gsave').innerHTML=ic('check',20)+'Uložit';
$('#ov').onclick=e=>{if(e.target.id==='ov')closeSheet()};
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commit()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeG()}});
function fit(){try{
  var d=Math.round(document.documentElement.getBoundingClientRect().top);if(!(d>0&&d<120))d=0;
  var T=navigator.standalone?Math.max(screen.height,window.innerHeight):window.innerHeight;
  var s=document.documentElement.style;s.setProperty("--H",T+"px");s.setProperty("--T","-"+d+"px")}catch(e){}}
function top0(){try{if(document.activeElement&&/TEXTAREA|INPUT/.test(document.activeElement.tagName))return;window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0}catch(e){}}
function sat(){try{if(!navigator.standalone)return;var p=document.createElement("div");p.style.cssText="position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top,0px)";document.body.appendChild(p);var v=parseFloat(getComputedStyle(p).paddingTop)||0;p.remove();document.documentElement.style.setProperty("--sat",(v<20?(screen.height>=852?59:47):0)+"px")}catch(e){}}
function sync(){fit();sat()}
sync();[100,400,1000].forEach(function(t){setTimeout(sync,t)});
["resize","orientationchange","pageshow","focus","scroll"].forEach(function(ev){window.addEventListener(ev,function(){setTimeout(sync,60)})});
document.addEventListener("visibilitychange",function(){setTimeout(sync,60)});
document.addEventListener("focusout",function(){setTimeout(sync,350)});
if(window.visualViewport){visualViewport.addEventListener("resize",function(){setTimeout(sync,60)});visualViewport.addEventListener("scroll",function(){setTimeout(sync,60)})}

document.addEventListener("gesturestart",function(e){e.preventDefault()});
render();
</script>
</body>
</html>
